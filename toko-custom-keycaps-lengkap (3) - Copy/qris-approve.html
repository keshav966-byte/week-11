<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRIS Approve Simulator — Toko Custom Keycaps</title>
  <style>
    :root {
      --bg: #f4f3ef;
      --surface: #ffffff;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --border: #e2e0d8;
      --accent: #d95d39;
      --green: #2e7d32;
      --green-hover: #1b5e20;
      --red: #c62828;
      --red-bg: #ffebee;
      --green-bg: #edf7ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .wrap {
      max-width: 660px;
      margin: 0 auto;
    }

    .head {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .head-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .head-badge {
      width: 34px;
      height: 34px;
      background-color: var(--text);
      color: var(--surface);
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 12px;
    }

    .head h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .head p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .live-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green);
      background-color: var(--green-bg);
      border: 1px solid #b8e0b9;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--green);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 20px 0 10px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .tx-card.highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .tx-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .tx-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-size: 1rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text);
    }

    .tx-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-approve {
      background-color: var(--green);
      color: #ffffff;
    }

    .btn-approve:hover {
      background-color: var(--green-hover);
    }

    .btn-reject {
      background-color: transparent;
      border-color: #f5c2c2;
      color: var(--red);
    }

    .btn-reject:hover {
      background-color: var(--red-bg);
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .tag-paid {
      background-color: var(--green-bg);
      color: var(--green);
      border: 1px solid #b8e0b9;
    }

    .tag-rejected {
      background-color: var(--red-bg);
      color: var(--red);
      border: 1px solid #f5c2c2;
    }

    .empty {
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .log {
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="head-brand">
        <div class="head-badge">QRIS</div>
        <div>
          <h1>QRIS Payment Simulator</h1>
          <p>Approve atau tolak transaksi QRIS Toko Custom Keycaps secara realtime</p>
        </div>
      </div>
      <span class="live-pill"><span class="dot"></span> LIVE SYNC</span>
    </header>

    <div id="sim-root"></div>
    <div id="sim-log" class="log"></div>
  </div>

  <script src="app.js"></script>
  <script src="qris-approve.js"></script>
</body>
</html>
