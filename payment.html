<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran QRIS — Toko Custom Keycaps</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="site-topbar"></div>

  <main>
    <section class="intro compact">
      <div class="container narrow">
        <span class="step-tag">Langkah 3 dari 3 &bull; Pembayaran QRIS</span>
        <h1>Pembayaran QRIS</h1>
        <p>Scan kode QRIS di bawah ini menggunakan aplikasi mobile banking atau e-wallet Anda untuk menyelesaikan pesanan.</p>
      </div>
    </section>

    <section class="page-section">
      <div class="container narrow" id="payment-root"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.TCKStore;
      store.renderTopbar("history");
      store.renderFooter();

      const root = document.getElementById("payment-root");
      const params = new URLSearchParams(window.location.search);
      let orderId = params.get("order");

      if (!orderId) {
        const all = store.getOrders();
        if (all.length > 0) orderId = all[0].id;
      }

      let lastRenderedStatus = null;
      let redirectTimer = null;
      let redirectCountdown = 3;

      function startRedirectCountdown(id) {
        if (redirectTimer) return;
        redirectCountdown = 3;
        const el = document.getElementById("redirect-sec");
        if (el) el.textContent = String(redirectCountdown);

        redirectTimer = setInterval(function () {
          redirectCountdown -= 1;
          const secEl = document.getElementById("redirect-sec");
          if (secEl) secEl.textContent = String(Math.max(0, redirectCountdown));
          if (redirectCountdown <= 0) {
            clearInterval(redirectTimer);
            redirectTimer = null;
            window.location.href = "thank-you.html?order=" + encodeURIComponent(id);
          }
        }, 1000);
      }

      function renderPayment(force) {
        const order = orderId ? store.getOrderById(orderId) : null;

        if (!order) {
          root.innerHTML =
            '<div class="panel empty-state">' +
            "  <h3>Transaksi tidak ditemukan</h3>" +
            "  <p>Nomor invoice tidak valid atau belum ada pesanan yang dibuat.</p>" +
            '  <a href="index.html" class="btn btn-primary">Kembali ke Katalog</a>' +
            "</div>";
          return;
        }

        if (!force && lastRenderedStatus === order.status) {
          return;
        }
        const prevStatus = lastRenderedStatus;
        lastRenderedStatus = order.status;

        const qrisSvg = store.generateDummyQrisSvg(order.id + "|" + order.grandTotal + "|" + order.qrisRef);
        const thankYouUrl = "thank-you.html?order=" + encodeURIComponent(order.id);
        const simUrl = "qris-approve.html?order=" + encodeURIComponent(order.id);

        let statusSection = "";
        if (order.status === "PAID") {
          statusSection =
            '<div class="realtime-banner paid">' +
            "  <strong>&#10003; Pembayaran Berhasil (PAID)</strong><br />" +
            "  Ref Approval: <code>" + store.escapeHtml(order.approvalRef || "-") + "</code> &bull; Waktu Lunas: " + store.escapeHtml(store.formatWaktu(order.paidAt)) +
            (prevStatus === "PENDING"
              ? '<div style="margin-top:8px;">Mengalihkan ke struk pesanan dalam <strong id="redirect-sec">3</strong> detik...</div>'
              : "") +
            "</div>" +
            '<div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;">' +
            '  <a href="' + thankYouUrl + '" class="btn btn-primary">Lihat Struk Pesanan</a>' +
            '  <a href="history.html" class="btn btn-outline">Lihat Riwayat Transaksi</a>' +
            "</div>";
        } else if (order.status === "REJECTED") {
          statusSection =
            '<div class="realtime-banner rejected">' +
            "  <strong>&#10005; Pembayaran Ditolak / Dibatalkan</strong><br />" +
            "  Waktu: " + store.escapeHtml(store.formatWaktu(order.rejectedAt)) +
            "</div>" +
            '<div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;">' +
            '  <a href="index.html" class="btn btn-primary">Pesan Ulang</a>' +
            '  <a href="history.html" class="btn btn-outline">Riwayat Transaksi</a>' +
            "</div>";
        } else {
          statusSection =
            '<div class="realtime-banner">' +
            "  <strong>Menunggu Pembayaran</strong><br />" +
            "  Halaman ini memeriksa status pembayaran secara otomatis. Buka <strong>Simulator QRIS</strong> untuk menyetujui (Approve) transaksi ini." +
            "</div>" +
            '<div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;">' +
            '  <a href="' + simUrl + '" target="_blank" rel="noopener" class="btn btn-dark">Buka Simulator QRIS &#8599;</a>' +
            '  <a href="history.html" class="btn btn-outline">Riwayat Transaksi</a>' +
            "</div>";
        }

        const itemRows = order.items.map(function (it) {
          return (
            '<div class="summary-row">' +
            "  <span>" + store.escapeHtml(it.name) + " (" + store.escapeHtml(it.sku) + ") &times; " + it.qty + "</span>" +
            "  <strong>" + store.formatRupiah(it.subtotal) + "</strong>" +
            "</div>"
          );
        }).join("");

        root.innerHTML =
          '<section class="panel">' +
          '  <div class="panel-title">' +
          "    <span>Invoice: " + store.escapeHtml(order.id) + "</span>" +
          "    <span>" + store.renderStatusBadge(order.status) + "</span>" +
          "  </div>" +
          '  <div class="qris-box">' +
          '    <div style="font-size:0.85rem; color:var(--muted);">Total Pembayaran</div>' +
          '    <div class="qris-amount">' + store.formatRupiah(order.grandTotal) + "</div>" +
          '    <div class="qris-frame">' +
          '      <div class="qris-header">' +
          '        <span class="qris-logo">QRIS</span>' +
          "        <span>Toko Custom Keycaps</span>" +
          "      </div>" +
          "      " + qrisSvg +
          '      <div class="qris-nmid">NMID: ID1026000918421 &bull; Ref: ' + store.escapeHtml(order.qrisRef) + "</div>" +
          "    </div>" +
          "    " + statusSection +
          "  </div>" +
          '  <hr class="summary-divider" style="margin:26px 0 18px;" />' +
          '  <h3 style="font-size:0.98rem; margin-bottom:12px;">Rincian Pesanan</h3>' +
          "  " + itemRows +
          '  <hr class="summary-divider" />' +
          '  <div class="summary-row"><span>Subtotal</span><strong>' + store.formatRupiah(order.subtotal) + "</strong></div>" +
          '  <div class="summary-row"><span>Ongkos Kirim (' + store.escapeHtml(order.shippingMethod) + ")</span><strong>" + (order.ongkir === 0 ? "Gratis" : store.formatRupiah(order.ongkir)) + "</strong></div>" +
          '  <div class="summary-total" style="margin-bottom:0;"><span>Grand Total</span><span>' + store.formatRupiah(order.grandTotal) + "</span></div>" +
          "</section>";

        if (order.status === "PAID" && prevStatus === "PENDING") {
          store.showToast("Pembayaran QRIS berhasil diverifikasi (PAID)!");
          startRedirectCountdown(order.id);
        }
      }

      store.onRealtimeUpdate(function () {
        renderPayment(false);
      });

      setInterval(function () {
        renderPayment(false);
      }, 1000);

      renderPayment(true);
    })();
  </script>
</body>
</html>
