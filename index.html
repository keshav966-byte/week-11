<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog — Toko Custom Keycaps</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="site-topbar"></div>

  <main>
    <section class="intro">
      <div class="container">
        <div class="intro-top">
          <div>
            <h1>Katalog Keycaps</h1>
            <p>Daftar lengkap koleksi custom keycaps dan artisan resin untuk keyboard mekanikal MX-stem.</p>
          </div>
          <div class="catalog-badge" id="catalog-count">30 Produk Katalog</div>
        </div>

        <div class="filter-bar">
          <input type="search" id="search-input" class="form-control filter-search" placeholder="Cari nama keycap atau SKU (mis. KC-003, Artisan)..." />
          <select id="profile-filter" class="form-control filter-select" aria-label="Filter Profil & Material">
            <option value="ALL">Semua Profil / Material</option>
            <option value="Cherry • PBT">Cherry • PBT</option>
            <option value="Cherry • Resin">Cherry • Resin</option>
            <option value="Artisan • Resin">Artisan • Resin</option>
            <option value="OEM • PBT">OEM • PBT</option>
            <option value="OEM • Resin">OEM • Resin</option>
            <option value="SA • ABS">SA • ABS</option>
            <option value="SA • PBT">SA • PBT</option>
            <option value="SA • Resin">SA • Resin</option>
            <option value="XDA • PBT">XDA • PBT</option>
          </select>
          <select id="sort-select" class="form-control filter-select" aria-label="Urutkan Harga">
            <option value="default">Urutan Default (SKU)</option>
            <option value="price-asc">Harga: Terendah ke Tertinggi</option>
            <option value="price-desc">Harga: Tertinggi ke Terendah</option>
          </select>
        </div>
      </div>
    </section>

    <section class="catalog-section">
      <div class="container">
        <div id="catalog-grid" class="catalog-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.TCKStore;
      store.renderTopbar("katalog");
      store.renderFooter();

      const grid = document.getElementById("catalog-grid");
      const countBadge = document.getElementById("catalog-count");
      const searchInput = document.getElementById("search-input");
      const profileFilter = document.getElementById("profile-filter");
      const sortSelect = document.getElementById("sort-select");

      function getQtyInCart(sku) {
        const found = store.getCart().find(function (c) {
          return c.sku === sku;
        });
        return found ? found.qty : 0;
      }

      function renderCatalog() {
        const keyword = searchInput.value.trim().toLowerCase();
        const selectedProfile = profileFilter.value;
        const sortBy = sortSelect.value;

        let filtered = store.products.filter(function (item) {
          const matchKeyword =
            !keyword ||
            item.name.toLowerCase().includes(keyword) ||
            item.sku.toLowerCase().includes(keyword) ||
            item.desc.toLowerCase().includes(keyword) ||
            item.profile.toLowerCase().includes(keyword);
          const matchProfile = selectedProfile === "ALL" || item.profile === selectedProfile;
          return matchKeyword && matchProfile;
        });

        if (sortBy === "price-asc") {
          filtered = filtered.slice().sort(function (a, b) {
            return a.priceNum - b.priceNum;
          });
        } else if (sortBy === "price-desc") {
          filtered = filtered.slice().sort(function (a, b) {
            return b.priceNum - a.priceNum;
          });
        }

        countBadge.textContent = filtered.length + " Produk Ditampilkan";

        if (filtered.length === 0) {
          grid.innerHTML =
            '<div class="panel empty-state" style="grid-column: 1 / -1;">' +
            "  <h3>Keycap tidak ditemukan</h3>" +
            "  <p>Coba ubah kata kunci pencarian atau reset filter profil keycap.</p>" +
            '  <button type="button" class="btn btn-outline" id="btn-reset-filter">Reset Filter</button>' +
            "</div>";
          return;
        }

        grid.innerHTML = filtered.map(function (item) {
          const inCart = getQtyInCart(item.sku);
          const btnText = inCart > 0
            ? "+ Tambah Lagi (" + inCart + " di keranjang)"
            : "+ Tambah ke Keranjang";

          return (
            '<article class="card">' +
            '  <div class="card-visual">' +
            '    <img src="' + store.escapeHtml(item.img) + '" alt="' + store.escapeHtml(item.name) + '" loading="lazy" />' +
            "  </div>" +
            '  <div class="card-body">' +
            '    <div class="card-meta">' +
            '      <span class="profile-tag">' + store.escapeHtml(item.profile) + "</span>" +
            '      <span class="stock-status ' + (item.limited ? "limited" : "") + '">' + store.escapeHtml(item.stock) + "</span>" +
            "    </div>" +
            '    <h2 class="card-title">' + store.escapeHtml(item.name) + "</h2>" +
            '    <p class="card-desc">' + store.escapeHtml(item.desc) + "</p>" +
            '    <div class="card-footer">' +
            '      <span class="price">' + store.escapeHtml(item.price) + "</span>" +
            '      <span class="sku">' + store.escapeHtml(item.sku) + "</span>" +
            "    </div>" +
            '    <button type="button" class="btn btn-primary btn-block btn-add-cart" data-sku="' + store.escapeHtml(item.sku) + '">' +
            "      " + btnText +
            "    </button>" +
            "  </div>" +
            "</article>"
          );
        }).join("");
      }

      grid.addEventListener("click", function (e) {
        if (e.target.id === "btn-reset-filter") {
          searchInput.value = "";
          profileFilter.value = "ALL";
          sortSelect.value = "default";
          renderCatalog();
          return;
        }

        const btn = e.target.closest(".btn-add-cart");
        if (!btn) return;
        const sku = btn.getAttribute("data-sku");
        const item = store.products.find(function (p) {
          return p.sku === sku;
        });
        if (!item) return;

        store.addToCart(sku, 1);
        store.showToast(item.name + " (" + item.sku + ") ditambahkan ke keranjang");
        renderCatalog();
      });

      searchInput.addEventListener("input", renderCatalog);
      profileFilter.addEventListener("change", renderCatalog);
      sortSelect.addEventListener("change", renderCatalog);

      store.onRealtimeUpdate(function () {
        renderCatalog();
      });

      renderCatalog();
    })();
  </script>
</body>
</html>
